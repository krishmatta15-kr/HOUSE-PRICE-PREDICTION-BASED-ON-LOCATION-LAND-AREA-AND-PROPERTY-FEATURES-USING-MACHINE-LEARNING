<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D House Tour — hearth. Interactive Walkthrough</title>
  <meta name="description" content="Immersive 3D architectural house tour. Walk through the living room, chef's kitchen, master suite, finished basement, and garage.">

  <!-- Google Fonts: Plus Jakarta Sans / Cormorant Garamond / JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Three.js for 3D Walkthrough Engine (with Multi-CDN Failover) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --bg-dark: #0a110d;
      --card-bg: rgba(18, 30, 23, 0.85);
      --card-border: rgba(232, 180, 110, 0.28);
      --hearth-gold: #e8b04a;
      --hearth-amber: #f59e0b;
      --gold-light: #ffd68a;
      --emerald: #34d399;
      --timber: #8b5a2b;
      --text-main: #fbf7ee;
      --text-muted: #b8c7bd;
      --text-sub: #7f9486;
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 3D Viewport */
    #tour-canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #tour-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #tour-canvas:active {
      cursor: grabbing;
    }

    /* Top HUD Header */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-header * {
      pointer-events: auto;
    }

    .brand-group {
      background: rgba(13, 22, 18, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .back-btn {
      color: var(--hearth-gold);
      background: rgba(232, 176, 74, 0.12);
      border: 1px solid rgba(232, 176, 74, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: var(--hearth-gold);
      color: #0d1612;
      transform: translateX(-2px);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .house-spec-pill {
      background: rgba(13, 22, 18, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .spec-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .spec-item strong {
      color: var(--gold-light);
      font-weight: 700;
    }

    /* Right Controls HUD */
    .hud-right {
      position: absolute;
      top: 80px;
      right: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .hud-right * {
      pointer-events: auto;
    }

    /* Floor Plan Mini-Map Card */
    .minimap-card {
      width: 210px;
      background: rgba(13, 22, 18, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }

    .minimap-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--hearth-gold);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .minimap-svg {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      background: #09120e;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .minimap-room {
      cursor: pointer;
      transition: fill 0.2s ease;
    }

    .minimap-room:hover {
      fill: rgba(232, 176, 74, 0.4) !important;
    }

    .minimap-room.active {
      fill: rgba(232, 176, 74, 0.65) !important;
      stroke: #ffd68a;
      stroke-width: 1.5;
    }

    /* Floating Tool Actions */
    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .icon-action-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(13, 22, 18, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .icon-action-btn:hover {
      background: rgba(232, 176, 74, 0.2);
      border-color: var(--hearth-gold);
      color: var(--gold-light);
      transform: scale(1.05);
    }

    .icon-action-btn.active {
      background: var(--hearth-gold);
      color: #0d1612;
      border-color: var(--gold-light);
    }

    /* Bottom Room Navigation Bar */
    .hud-bottom {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      max-width: 95vw;
    }

    .hud-bottom * {
      pointer-events: auto;
    }

    .room-selector-dock {
      background: rgba(13, 22, 18, 0.92);
      backdrop-filter: blur(18px);
      border: 1.5px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      box-shadow: 0 16px 45px rgba(0,0,0,0.65);
    }

    .room-pill {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .room-pill:hover {
      color: var(--text-main);
      background: rgba(255,255,255,0.06);
    }

    .room-pill.active {
      background: linear-gradient(135deg, #e8b04a 0%, #b87a22 100%);
      color: #0d1612;
      box-shadow: 0 4px 18px rgba(232, 176, 74, 0.4);
      transform: translateY(-1px);
    }

    .room-pill i {
      font-size: 14px;
    }

    /* Room Information Toast */
    .room-toast {
      background: rgba(18, 30, 23, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(232, 180, 110, 0.25);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .room-toast strong {
      color: var(--gold-light);
    }

    /* Hotspot Annotation Pin */
    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 15;
    }

    .hotspot-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(232, 176, 74, 0.25);
      border: 2px solid var(--hearth-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseGlow 2s infinite;
      color: #ffd68a;
      font-size: 12px;
      box-shadow: 0 0 12px rgba(232, 176, 74, 0.5);
    }

    .hotspot-tooltip {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(13, 22, 18, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--hearth-gold);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
      width: max-content;
      max-width: 220px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .hotspot:hover .hotspot-tooltip {
      opacity: 1;
      visibility: visible;
      left: 40px;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(232, 176, 74, 0.6); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(232, 176, 74, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(232, 176, 74, 0); }
    }

    /* Helper instruction overlay */
    .walkthrough-hint {
      position: absolute;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 18;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 3D Canvas Container -->
  <div id="tour-canvas-container">
    <canvas id="tour-canvas"></canvas>
  </div>

  <!-- Interactive 3D Hotspot Container -->
  <div id="hotspot-layer"></div>

  <!-- Top HUD Header -->
  <div class="hud-header">
    <div class="brand-group">
      <a href="index.html" class="back-btn" title="Back to Valuation Studio">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Studio</span>
      </a>
      <span class="brand-title">hearth<span style="color:var(--hearth-gold); font-family:var(--font-serif); font-style:italic;">.</span> <span style="font-size:14px; font-weight:600; color:var(--text-muted);">| 3D House Tour</span></span>
    </div>

    <div class="house-spec-pill">
      <div class="spec-item">
        <i class="fa-solid fa-house" style="color:var(--hearth-gold);"></i>
        <span id="hudArea">1,800 sq ft</span>
      </div>
      <div class="spec-item">
        <i class="fa-solid fa-award" style="color:#34d399;"></i>
        <span>Qual <strong id="hudQual">7/10</strong></span>
      </div>
      <div class="spec-item">
        <i class="fa-solid fa-bed"></i>
        <span id="hudBeds">3 Bed</span>
      </div>
      <div class="spec-item">
        <i class="fa-solid fa-bath"></i>
        <span id="hudBaths">2 Bath</span>
      </div>
      <div class="spec-item" style="border-left: 1px solid rgba(255,255,255,0.15); padding-left: 10px;">
        <i class="fa-solid fa-tag" style="color:var(--gold-light);"></i>
        <strong id="hudValuation" style="color:#ffd68a; font-size:14px;">$231,000</strong>
      </div>
    </div>
  </div>

  <!-- Right HUD: Mini-map & Tool Actions -->
  <div class="hud-right">
    <!-- Interactive Floor Plan Mini-Map -->
    <div class="minimap-card">
      <div class="minimap-title">
        <span><i class="fa-solid fa-map-location-dot"></i> Floor Plan</span>
        <span id="minimapFloorLabel" style="font-size:10px; color:#ffd68a;">Level 1</span>
      </div>
      <svg class="minimap-svg" viewBox="0 0 200 140" id="miniMapSvg">
        <!-- Living Room -->
        <rect id="mm-living" class="minimap-room active" x="15" y="15" width="80" height="65" fill="#1b2e23" stroke="#2a4535" rx="4" onclick="navigateToRoom('living')"/>
        <text x="35" y="52" fill="#e8b04a" font-size="10" font-weight="700">Living</text>

        <!-- Kitchen & Dining -->
        <rect id="mm-kitchen" class="minimap-room" x="100" y="15" width="85" height="50" fill="#1b2e23" stroke="#2a4535" rx="4" onclick="navigateToRoom('kitchen')"/>
        <text x="122" y="44" fill="#cbd5e1" font-size="10" font-weight="600">Kitchen</text>

        <!-- Master Bedroom -->
        <rect id="mm-bedroom" class="minimap-room" x="15" y="85" width="70" height="45" fill="#1b2e23" stroke="#2a4535" rx="4" onclick="navigateToRoom('bedroom')"/>
        <text x="25" y="112" fill="#cbd5e1" font-size="9" font-weight="600">Master Bed</text>

        <!-- Bathroom -->
        <rect id="mm-bathroom" class="minimap-room" x="90" y="70" width="45" height="35" fill="#1b2e23" stroke="#2a4535" rx="4" onclick="navigateToRoom('bathroom')"/>
        <text x="96" y="91" fill="#cbd5e1" font-size="8" font-weight="600">Bath</text>

        <!-- Garage -->
        <rect id="mm-garage" class="minimap-room" x="140" y="70" width="45" height="60" fill="#1b2e23" stroke="#2a4535" rx="4" onclick="navigateToRoom('garage')"/>
        <text x="145" y="105" fill="#cbd5e1" font-size="8" font-weight="600">Garage</text>

        <!-- Basement Tab -->
        <rect id="mm-basement" class="minimap-room" x="90" y="110" width="45" height="20" fill="#1b2e23" stroke="#2a4535" rx="3" onclick="navigateToRoom('basement')"/>
        <text x="95" y="124" fill="#cbd5e1" font-size="7" font-weight="600">Bsmt ⬇</text>

        <!-- Radar Position Marker -->
        <circle id="radarDot" cx="55" cy="48" r="5" fill="#ffd68a" stroke="#000" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- Quick Tool Actions -->
    <div class="action-btn-group">
      <button class="icon-action-btn" id="btnLighting" title="Toggle Golden Hour / Cozy Night" onclick="toggleDayNight()">
        <i class="fa-solid fa-moon" id="lightingIcon"></i>
      </button>
      <button class="icon-action-btn" id="btnAutoSpin" title="Toggle Auto-Orbit" onclick="toggleAutoTour()">
        <i class="fa-solid fa-arrows-spin"></i>
      </button>
      <button class="icon-action-btn" id="btnResetView" title="Reset Camera View" onclick="resetCurrentRoomView()">
        <i class="fa-solid fa-crosshairs"></i>
      </button>
    </div>
  </div>

  <!-- Drag / Walk Instruction Hint -->
  <div class="walkthrough-hint">
    <i class="fa-solid fa-hand-pointer" style="color:var(--hearth-gold);"></i>
    <span>Click & drag to look around 360° • Click room buttons to travel inside</span>
  </div>

  <!-- Bottom Room Navigation Dock -->
  <div class="hud-bottom">
    <div class="room-toast" id="roomToast">
      <i class="fa-solid fa-compass" style="color:var(--hearth-gold);"></i>
      <span>Currently in: <strong id="toastRoomName">Great Room & Hearth Fireplace</strong></span>
    </div>

    <div class="room-selector-dock">
      <button class="room-pill active" onclick="navigateToRoom('living')" id="pill-living">
        <i class="fa-solid fa-couch"></i>
        <span>Living Room</span>
      </button>
      <button class="room-pill" onclick="navigateToRoom('kitchen')" id="pill-kitchen">
        <i class="fa-solid fa-utensils"></i>
        <span>Chef Kitchen</span>
      </button>
      <button class="room-pill" onclick="navigateToRoom('bedroom')" id="pill-bedroom">
        <i class="fa-solid fa-bed"></i>
        <span>Master Suite</span>
      </button>
      <button class="room-pill" onclick="navigateToRoom('bathroom')" id="pill-bathroom">
        <i class="fa-solid fa-bath"></i>
        <span>Spa Bath</span>
      </button>
      <button class="room-pill" onclick="navigateToRoom('basement')" id="pill-basement">
        <i class="fa-solid fa-layer-group"></i>
        <span>Basement Den</span>
      </button>
      <button class="room-pill" onclick="navigateToRoom('garage')" id="pill-garage">
        <i class="fa-solid fa-warehouse"></i>
        <span>Garage Bay</span>
      </button>
      <button class="room-pill" onclick="navigateToRoom('exterior')" id="pill-exterior">
        <i class="fa-solid fa-tree"></i>
        <span>Patio Deck</span>
      </button>
    </div>
  </div>

  <!-- 3D Tour JavaScript Engine -->
  <script>
    // Parse URL query specs if provided from index.html
    const params = new URLSearchParams(window.location.search);
    const spec = {
      area: parseInt(params.get('area') || '1800'),
      qual: parseInt(params.get('qual') || '7'),
      beds: parseInt(params.get('beds') || '3'),
      baths: parseInt(params.get('baths') || '2'),
      cars: parseInt(params.get('cars') || '2'),
      bsmt: parseInt(params.get('bsmt') || '900'),
      year: parseInt(params.get('year') || '2005'),
      price: parseInt(params.get('price') || '231000')
    };

    // Update HUD specs
    document.getElementById('hudArea').textContent = spec.area.toLocaleString() + ' sq ft';
    document.getElementById('hudQual').textContent = spec.qual + '/10';
    document.getElementById('hudBeds').textContent = spec.beds + ' Bed';
    document.getElementById('hudBaths').textContent = spec.baths + ' Bath';
    document.getElementById('hudValuation').textContent = '$' + spec.price.toLocaleString();

    // Rooms Configuration & Camera Coordinates
    const ROOMS = {
      living: {
        name: "Great Room & Hearth Fireplace",
        desc: "Vaulted timber ceilings, oak hardwood floors, and natural stone fireplace.",
        camPos: { x: 0, y: 3.2, z: 4.8 },
        lookAt: { x: 0, y: 2.2, z: -4.5 },
        radar: { cx: 55, cy: 48 },
        level: "Level 1",
        hotspots: [
          { pos: { x: 0, y: 1.8, z: -4.2 }, title: "Stone Hearth Fireplace", detail: "Natural riverstone facade with solid reclaimed cedar mantel and warm gas embers." },

          { pos: { x: 2.4, y: 0.6, z: 1.5 }, title: "White Oak Hardwood", detail: "Quarter-sawn wide plank American oak finished with durable satin seal." }
        ]
      },
      kitchen: {
        name: "Gourmet Chef's Kitchen & Island",
        desc: "Calacatta gold quartz waterfall counter, custom shaker cabinets, and gas range.",
        camPos: { x: 8.5, y: 3.2, z: 3.5 },
        lookAt: { x: 8.5, y: 2.2, z: -3.5 },
        radar: { cx: 142, cy: 40 },
        level: "Level 1",
        hotspots: [
          { pos: { x: 8.5, y: 1.6, z: -0.5 }, title: "Waterfall Quartz Island", detail: "Bookmatched 3cm engineered quartz with breakfast bar seating for four." },
          { pos: { x: 11.5, y: 2.2, z: -2.5 }, title: "Custom Shaker Cabinetry", detail: "Soft-close solid maple cabinet boxes with under-mount LED ambient task lighting." }
        ]
      },
      bedroom: {
        name: "Primary Master Suite",
        desc: "Spacious master retreat with custom recessed lighting and morning garden views.",
        camPos: { x: -8.5, y: 3.2, z: 3.0 },
        lookAt: { x: -8.5, y: 2.0, z: -4.0 },
        radar: { cx: 50, cy: 108 },
        level: "Level 1",
        hotspots: [
          { pos: { x: -8.5, y: 1.4, z: -3.2 }, title: "King Platform Bed & Upholstered Wall", detail: "Architectural acoustic wall panels with built-in reading sconces." },
          { pos: { x: -11.5, y: 2.0, z: 0.0 }, title: "Walk-in Dressing Closet", detail: "Custom California-style closet organizers with cedar lining." }
        ]
      },
      bathroom: {
        name: "En-Suite Spa Bathroom",
        desc: "Frameless glass walk-in shower, freestanding soaking tub, and double floating vanity.",
        camPos: { x: -4.5, y: 3.0, z: -6.5 },
        lookAt: { x: -4.5, y: 1.8, z: -11.0 },
        radar: { cx: 112, cy: 88 },
        level: "Level 1",
        hotspots: [
          { pos: { x: -4.5, y: 1.0, z: -10.2 }, title: "Freestanding Soaking Tub", detail: "Deep acrylic sculptural bathtub with matte black floor-mounted filler." },
          { pos: { x: -6.5, y: 2.2, z: -8.5 }, title: "Dual Vanity & Backlit Mirror", detail: "Quartz countertop with integrated undermount porcelain sinks and defogging mirror." }
        ]
      },
      basement: {
        name: "Finished Lower Entertainment Den",
        desc: `Full ${spec.bsmt} sq ft finished foundation with 9ft acoustic ceilings and home theater.`,
        camPos: { x: 0, y: -4.2, z: 4.0 },
        lookAt: { x: 0, y: -4.8, z: -5.0 },
        radar: { cx: 112, cy: 120 },
        level: "Lower Level (Basement)",

    // Switch Room
    function navigateToRoom(roomKey) {
      if (!ROOMS[roomKey]) return;
      activeRoomKey = roomKey;
      const r = ROOMS[roomKey];

      // Update HUD
      document.getElementById('toastRoomName').textContent = r.name;
      document.getElementById('minimapFloorLabel').textContent = r.level;

      // Update Navigation Pills
      document.querySelectorAll('.room-pill').forEach(btn => btn.classList.remove('active'));
      const pill = document.getElementById('pill-' + roomKey);
      if (pill) pill.classList.add('active');

      // Update Mini-map Highlight
      document.querySelectorAll('.minimap-room').forEach(rm => rm.classList.remove('active'));
      const mmEl = document.getElementById('mm-' + roomKey);
      if (mmEl) mmEl.classList.add('active');

      // Update Radar position
      const dot = document.getElementById('radarDot');
      if (dot && r.radar) {
        dot.setAttribute('cx', r.radar.cx);
        dot.setAttribute('cy', r.radar.cy);
      }

      // Smooth camera transition
      targetCamPos = { ...r.camPos };
      targetLookAt = { ...r.lookAt };
      cameraYaw = 0;
      cameraPitch = 0;

      // Re-populate hotspots
      updateHotspots();
    }

    // Interactive Hotspot Pins
    function updateHotspots() {
      const layer = document.getElementById('hotspot-layer');
      layer.innerHTML = '';

      const r = ROOMS[activeRoomKey];
      if (!r || !r.hotspots) return;

      r.hotspots.forEach((hs, idx) => {
        const div = document.createElement('div');
        div.className = 'hotspot';
        div.id = 'hotspot-' + idx;
        div.innerHTML = `
          <div class="hotspot-ring">
            <i class="fa-solid fa-plus"></i>
          </div>
          <div class="hotspot-tooltip">
            <div style="font-weight:700; color:var(--hearth-gold); margin-bottom:2px;">${hs.title}</div>
            <div style="font-size:11px; color:#cbd5e1; line-height:1.4;">${hs.detail}</div>
          </div>
        `;
        layer.appendChild(div);
      });
    }

    function projectHotspots() {
      const r = ROOMS[activeRoomKey];
      if (!r || !r.hotspots) return;

      r.hotspots.forEach((hs, idx) => {
        const el = document.getElementById('hotspot-' + idx);
        if (!el) return;

        const v = new THREE.Vector3(hs.pos.x, hs.pos.y, hs.pos.z);
        v.project(camera);

        // Check if behind camera
        if (v.z > 1.0) {
          el.style.display = 'none';
          return;
        }

        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight;

        el.style.display = 'block';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      });
    }

      isNightMode = !isNightMode;
      const icon = document.getElementById('lightingIcon');

    function resetCurrentRoomView() {

    // Controls: Drag to look around
    function setupControls(canvas) {
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - prevMouseX;
        const deltaY = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;

        cameraYaw -= deltaX * 0.0035;
        cameraPitch -= deltaY * 0.003;
        cameraPitch = Math.max(-0.6, Math.min(0.6, cameraPitch));
      });

      // Touch events for mobile/tablet
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          prevMouseX = e.touches[0].clientX;
          prevMouseY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener('touchend', () => { isDragging = false; });

      canvas.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const deltaX = e.touches[0].clientX - prevMouseX;
        const deltaY = e.touches[0].clientY - prevMouseY;
        prevMouseX = e.touches[0].clientX;
        prevMouseY = e.touches[0].clientY;

        cameraYaw -= deltaX * 0.004;
        cameraPitch -= deltaY * 0.0035;
        cameraPitch = Math.max(-0.6, Math.min(0.6, cameraPitch));
      }, { passive: true });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Animation Loop
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Smooth camera position lerp
      camera.position.x += (targetCamPos.x - camera.position.x) * 0.05;
      camera.position.y += (targetCamPos.y - camera.position.y) * 0.05;
      camera.position.z += (targetCamPos.z - camera.position.z) * 0.05;

      // Auto spin
      if (autoSpin) {
        cameraYaw += 0.005;
      }

      // Compute look direction based on targetLookAt + yaw/pitch
      const dx = targetLookAt.x - targetCamPos.x;
      const dz = targetLookAt.z - targetCamPos.z;
      const baseAngle = Math.atan2(dx, dz);

      const lookDist = 8.0;
      const effectiveYaw = baseAngle + cameraYaw;

      const destLookX = camera.position.x + Math.sin(effectiveYaw) * Math.cos(cameraPitch) * lookDist;
      const destLookY = camera.position.y + Math.sin(cameraPitch) * lookDist;
      const destLookZ = camera.position.z + Math.cos(effectiveYaw) * Math.cos(cameraPitch) * lookDist;

      currentLookAt.x += (destLookX - currentLookAt.x) * 0.08;
      currentLookAt.y += (destLookY - currentLookAt.y) * 0.08;
      currentLookAt.z += (destLookZ - currentLookAt.z) * 0.08;

      camera.lookAt(currentLookAt.x, currentLookAt.y, currentLookAt.z);

      // Flickering hearth fire light
      if (hearthLight) {
        hearthLight.intensity = (isNightMode ? 2.2 : 1.0) + Math.sin(Date.now() * 0.009) * 0.35 + Math.cos(Date.now() * 0.021) * 0.2;
      }

      renderer.render(scene, camera);
      projectHotspots();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => {
        init3DTour();
        animate();
      });
    } else {
      init3DTour();
      animate();
    }
  </script>
</body>
